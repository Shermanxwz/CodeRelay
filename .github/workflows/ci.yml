name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ['24']
        include:
          - os: ubuntu-24.04
            node: '26'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify built CLI starts
        run: node dist/src/cli.js --help
  package:
    name: Package and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run package
      - name: Verify deterministic archives
        run: |
          cp release/SHA256SUMS /tmp/coderelay-SHA256SUMS
          npm run package
          diff -u /tmp/coderelay-SHA256SUMS release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coderelay-packages-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 7
  container:
    name: Container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and exercise non-root gateway container
        run: |
          docker build -t coderelay:test .
          docker volume create coderelay-test-data
          docker run --rm -v coderelay-test-data:/var/lib/coderelay coderelay:test node dist/src/cli.js init --public-url https://relay.example.com --host 0.0.0.0
          docker run -d --name coderelay-test -p 127.0.0.1:8787:8787 -v coderelay-test-data:/var/lib/coderelay --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true coderelay:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/readyz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/readyz
          docker exec coderelay-test node dist/src/cli.js doctor
          docker exec coderelay-test node dist/src/cli.js status
      - name: Clean up container and state
        if: always()
        run: |
          docker rm -f coderelay-test || true
          docker volume rm coderelay-test-data || true
